name: Integration contract v2

on:
  pull_request:
    paths:
      - "contracts/**"
      - "lib/services/atlas-lead-bridge.ts"
      - "scripts/verify-integration-contract.mjs"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "lib/services/atlas-lead-bridge.ts"
      - "scripts/verify-integration-contract.mjs"
  schedule:
    - cron: "29 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration-reliability
      - run: node scripts/verify-integration-contract.mjs
